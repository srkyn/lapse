<svg viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="lapse project banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
    <linearGradient id="termgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1B2E"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="210" fill="url(#bg)"/>

  <!-- Dot texture -->
  <g fill="#FFFFFF" opacity="0.04">
    <circle cx="60" cy="30" r="1.5"/><circle cx="130" cy="55" r="1"/><circle cx="200" cy="20" r="1.5"/>
    <circle cx="280" cy="45" r="1"/><circle cx="350" cy="15" r="1.5"/><circle cx="420" cy="60" r="1"/>
    <circle cx="80" cy="85" r="1"/><circle cx="160" cy="110" r="1.5"/><circle cx="240" cy="90" r="1"/>
    <circle cx="320" cy="120" r="1"/><circle cx="45" cy="160" r="1.5"/><circle cx="170" cy="175" r="1"/>
    <circle cx="300" cy="155" r="1.5"/><circle cx="390" cy="180" r="1"/><circle cx="110" cy="195" r="1.5"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="210" fill="#F59E0B"/>

  <!-- Title -->
  <text x="32" y="72" font-family="'Courier New', Courier, monospace" font-size="54"
        font-weight="bold" fill="#FFFFFF" filter="url(#glow)">lapse</text>

  <!-- Subtitle -->
  <text x="33" y="100" font-family="'Courier New', Courier, monospace" font-size="13"
        fill="#94A3B8" letter-spacing="0.5">Entra ID device auditor — dual-signal stale detection</text>

  <!-- Badges row -->
  <g font-family="'Courier New', Courier, monospace" font-size="10">
    <!-- python badge -->
    <rect x="33" y="115" width="78" height="16" rx="3" fill="#1E3A5F"/>
    <text x="42" y="127" fill="#94A3B8">python</text>
    <text x="75" y="127" fill="#F59E0B">3.8+</text>

    <!-- read-only badge -->
    <rect x="118" y="115" width="82" height="16" rx="3" fill="#1E3A5F"/>
    <text x="127" y="127" fill="#94A3B8">graph</text>
    <text x="160" y="127" fill="#F59E0B">api</text>

    <!-- MIT badge -->
    <rect x="207" y="115" width="52" height="16" rx="3" fill="#1E3A5F"/>
    <text x="216" y="127" fill="#94A3B8">MIT</text>
    <text x="236" y="127" fill="#5EEAD4">✓</text>
  </g>

  <!-- Terminal window -->
  <rect x="470" y="18" width="415" height="172" rx="6" fill="url(#termgrad)" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Terminal title bar -->
  <rect x="470" y="18" width="415" height="24" rx="6" fill="#162033"/>
  <rect x="470" y="30" width="415" height="12" fill="#162033"/>
  <circle cx="490" cy="30" r="5" fill="#FF5F57"/>
  <circle cx="506" cy="30" r="5" fill="#FEBC2E"/>
  <circle cx="522" cy="30" r="5" fill="#28C840"/>
  <text x="548" y="34" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4A6B8A">lapse --days 90 --company-only --dry-run</text>

  <!-- Terminal content -->
  <g font-family="'Courier New', Courier, monospace" font-size="10" fill="#64748B">
    <!-- Header row -->
    <text x="482" y="60" fill="#4A6B8A">Display Name          OS        Last Sign-In  Days  Interactive  Status</text>
    <text x="482" y="72" fill="#263B54">──────────────────────────────────────────────────────────────────</text>

    <!-- Row 1 — stale, highlighted -->
    <rect x="480" y="76" width="398" height="16" rx="2" fill="#F59E0B" opacity="0.12"/>
    <text x="482" y="88" fill="#E2E8F0">LAPTOP-7B4F2A1D</text>
    <text x="610" y="88" fill="#CBD5E1">Windows</text>
    <text x="676" y="88" fill="#CBD5E1">2024-08-03</text>
    <text x="744" y="88" fill="#CBD5E1">305</text>
    <text x="772" y="88" fill="#FC8181">No</text>
    <text x="812" y="88" fill="#F59E0B" font-weight="bold">STALE</text>

    <!-- Row 2 — stale -->
    <rect x="480" y="92" width="398" height="16" rx="2" fill="#F59E0B" opacity="0.07"/>
    <text x="482" y="104" fill="#E2E8F0">DESKTOP-K9M3X8</text>
    <text x="610" y="104" fill="#CBD5E1">Windows</text>
    <text x="676" y="104" fill="#CBD5E1">2024-09-21</text>
    <text x="744" y="104" fill="#CBD5E1">256</text>
    <text x="772" y="104" fill="#FC8181">No</text>
    <text x="812" y="104" fill="#F59E0B" font-weight="bold">STALE</text>

    <!-- Row 3 — active -->
    <text x="482" y="120" fill="#94A3B8">iPhone-JSmith</text>
    <text x="610" y="120" fill="#4A6B8A">iOS</text>
    <text x="676" y="120" fill="#4A6B8A">2025-03-10</text>
    <text x="744" y="120" fill="#4A6B8A">56</text>
    <text x="772" y="120" fill="#5EEAD4">Yes</text>
    <text x="812" y="120" fill="#4A6B8A">active</text>

    <!-- Separator -->
    <text x="482" y="135" fill="#263B54">──────────────────────────────────────────────────────────────────</text>

    <!-- Summary line -->
    <text x="482" y="152" fill="#64748B">Total scanned: </text>
    <text x="563" y="152" fill="#E2E8F0">847</text>
    <text x="586" y="152" fill="#64748B">  Truly stale: </text>
    <text x="660" y="152" fill="#F59E0B">23</text>
    <text x="677" y="152" fill="#64748B">  Zero interactive: </text>
    <text x="773" y="152" fill="#FC8181">19</text>

    <!-- Dry run notice -->
    <text x="482" y="168" fill="#4A6B8A">Dry run: no changes made.</text>
    <text x="636" y="168" fill="#5EEAD4">✓</text>
  </g>

  <!-- Clock icon (top-right of terminal) -->
  <g transform="translate(851, 55)" fill="none" stroke="#F59E0B" stroke-width="1.8">
    <circle cx="0" cy="0" r="12" opacity="0.7"/>
    <line x1="0" y1="-7" x2="0" y2="0" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#F59E0B" stroke="none"/>
  </g>

  <!-- Bottom amber strip -->
  <rect x="0" y="198" width="900" height="12" fill="#F59E0B" opacity="0.80"/>
</svg>
