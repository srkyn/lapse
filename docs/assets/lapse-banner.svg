<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="lapse project banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060C18"/>
      <stop offset="100%" stop-color="#0A1525"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Dot texture -->
  <g fill="#FFFFFF" opacity="0.022">
    <circle cx="75"  cy="40"  r="1.5"/><circle cx="190" cy="85"  r="1"/>
    <circle cx="140" cy="165" r="1.5"/><circle cx="310" cy="55"  r="1"/>
    <circle cx="390" cy="135" r="1.5"/><circle cx="50"  cy="250" r="1"/>
    <circle cx="260" cy="310" r="1.5"/><circle cx="440" cy="280" r="1"/>
    <circle cx="100" cy="330" r="1.5"/><circle cx="360" cy="215" r="1"/>
  </g>

  <!-- Left orange accent bar -->
  <rect x="0" y="0" width="6" height="360" fill="#EA580C"/>

  <!-- Faded clock watermark -->
  <g transform="translate(55, 260)" opacity="0.07" fill="none" stroke="#F97316" stroke-width="3">
    <circle cx="60" cy="60" r="58"/>
    <line x1="60" y1="60" x2="60" y2="18"  stroke-width="4"/>
    <line x1="60" y1="60" x2="90" y2="72"  stroke-width="3"/>
    <circle cx="60" cy="60" r="5" fill="#F97316" stroke="none"/>
    <!-- Hour marks -->
    <line x1="60"  y1="5"   x2="60"  y2="14"/>
    <line x1="113" y1="60"  x2="104" y2="60"/>
    <line x1="60"  y1="115" x2="60"  y2="106"/>
    <line x1="7"   y1="60"  x2="16"  y2="60"/>
  </g>

  <!-- Title -->
  <text x="48" y="110" font-family="'Courier New',Courier,monospace"
        font-size="88" font-weight="bold" fill="#FFFFFF">lapse</text>

  <!-- Subtitle -->
  <text x="52" y="148" font-family="'Courier New',Courier,monospace"
        font-size="13" fill="#7C3000" letter-spacing="2">ENTRA ID DEVICE AUDITOR</text>

  <!-- Tagline -->
  <text x="52" y="172" font-family="'Courier New',Courier,monospace"
        font-size="12" fill="#334155">Two signals. One trustworthy list.</text>

  <!-- Badges -->
  <g font-family="'Courier New',Courier,monospace" font-size="11">
    <rect x="52"  y="192" width="96"  height="22" rx="4" fill="#0A1828"/>
    <text x="62"  y="208" fill="#7C3000">python</text>
    <text x="108" y="208" fill="#EA580C">3.8+</text>

    <rect x="155" y="192" width="104" height="22" rx="4" fill="#0A1828"/>
    <text x="165" y="208" fill="#7C3000">graph</text>
    <text x="202" y="208" fill="#EA580C">api</text>

    <rect x="266" y="192" width="70"  height="22" rx="4" fill="#0A1828"/>
    <text x="276" y="208" fill="#7C3000">MIT</text>
    <text x="304" y="208" fill="#22C55E">✓</text>
  </g>

  <!-- ============ RIGHT SIDE: Dual-signal flow diagram ============ -->
  <rect x="480" y="24" width="696" height="312" rx="8"
        fill="#060C18" stroke="#1A2A3A" stroke-width="1.5"/>

  <!-- Header bar -->
  <rect x="480" y="24" width="696" height="34" rx="8" fill="#0A1525"/>
  <rect x="480" y="46" width="696" height="12"       fill="#0A1525"/>
  <circle cx="505" cy="41" r="6" fill="#FF5F57"/>
  <circle cx="526" cy="41" r="6" fill="#FEBC2E"/>
  <circle cx="547" cy="41" r="6" fill="#28C840"/>
  <text x="574" y="46" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#1E3A52">lapse --tenant-id corp --days 90 --dry-run</text>

  <!-- Step 1 box -->
  <rect x="510" y="72" width="640" height="46" rx="6" fill="#0D1F35" stroke="#1E3A52" stroke-width="1"/>
  <text x="528" y="91" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#4A7A9B">STEP 1 — Graph API filter</text>
  <text x="528" y="107" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#64748B">approximateLastSignInDateTime ≤ 90d</text>
  <!-- Result box -->
  <rect x="1028" y="80" width="106" height="30" rx="4" fill="#1A3A5C"/>
  <text x="1048" y="92"  font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#94A3B8">flagged</text>
  <text x="1048" y="106" font-family="'Courier New',Courier,monospace"
        font-size="16" font-weight="bold" fill="#FFFFFF">847</text>

  <!-- Arrow down -->
  <line x1="828" y1="118" x2="828" y2="138" stroke="#1E3A52" stroke-width="2"/>
  <polygon points="822,134 828,148 834,134" fill="#1E3A52"/>

  <!-- Step 2 box -->
  <rect x="510" y="148" width="640" height="46" rx="6" fill="#0D1F35" stroke="#1E3A52" stroke-width="1"/>
  <text x="528" y="167" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#4A7A9B">STEP 2 — verify interactive sign-ins</text>
  <text x="528" y="183" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#64748B">auditLogs/signIns · signInEventTypes eq 'interactiveUser'</text>
  <!-- X mark -->
  <rect x="1028" y="156" width="106" height="30" rx="4" fill="#1A2020"/>
  <text x="1038" y="168"  font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#64748B">background</text>
  <text x="1038" y="182" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#94A3B8">sync: ✗</text>

  <!-- Arrow down -->
  <line x1="828" y1="194" x2="828" y2="214" stroke="#EA580C" stroke-width="2" opacity="0.6"/>
  <polygon points="822,210 828,224 834,210" fill="#EA580C" opacity="0.6"/>

  <!-- Result box — highlighted -->
  <rect x="510" y="224" width="640" height="60" rx="6"
        fill="#1A0E00" stroke="#EA580C" stroke-width="1.5"/>

  <!-- Big number on right -->
  <text x="1040" y="248" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#EA580C">truly stale</text>
  <text x="1040" y="274" font-family="'Courier New',Courier,monospace"
        font-size="28" font-weight="bold" fill="#F97316">23</text>

  <!-- Left side of result box -->
  <text x="528" y="244" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#EA580C">824 false positives removed</text>
  <text x="528" y="260" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#4B5563">background sync — MDM check-ins — Windows Update heartbeats</text>
  <text x="528" y="276" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#334155">→ no interactive user authentication found</text>

  <!-- Summary line -->
  <text x="510" y="310" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#334155">Dry run complete. 23 truly stale devices. No changes made.</text>
  <text x="1098" y="310" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#22C55E">✓</text>

  <!-- Bottom orange strip -->
  <rect x="0" y="344" width="1200" height="16" fill="#EA580C" opacity="0.65"/>
</svg>
